# The fuzz targets (cargo-fuzz). Not in the workspace: they need a nightly
# toolchain. Run them with `task fuzz` (see CONTRIBUTING.md).
[package]
name = "loremaster-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
loremaster-lang = { path = "../crates/loremaster-lang" }
loremaster-mcp = { path = "../crates/loremaster-mcp" }
loremaster-model = { path = "../crates/loremaster-model" }
loremaster-project = { path = "../crates/loremaster-project" }
loremaster-runtime = { path = "../crates/loremaster-runtime" }
serde_json = "1"

# Its own workspace, so that the main workspace and its Cargo.lock stay as they are.
[workspace]
members = ["."]

[[bin]]
name = "story_yaml"
path = "fuzz_targets/story_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "condition"
path = "fuzz_targets/condition.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markup"
path = "fuzz_targets/markup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dice_and_sums"
path = "fuzz_targets/dice_and_sums.rs"
test = false
doc = false
bench = false

[[bin]]
name = "commands"
path = "fuzz_targets/commands.rs"
test = false
doc = false
bench = false

[[bin]]
name = "save"
path = "fuzz_targets/save.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp"
path = "fuzz_targets/mcp.rs"
test = false
doc = false
bench = false
