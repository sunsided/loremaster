version: "3"

vars:
  CARGO: cargo

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  fmt:
    desc: Apply Rust formatting
    cmds:
      - "{{.CARGO}} fmt"

  fmt:check:
    desc: Check Rust formatting
    cmds:
      - "{{.CARGO}} fmt -- --check"

  lint:
    desc: Check clippy lints for all targets
    cmds:
      - "{{.CARGO}} clippy --workspace --all-targets --no-default-features -- -D warnings"

  lint:workflows:
    desc: Check the GitHub workflows with actionlint and zizmor (needs docker and uv)
    cmds:
      # Use the same versions as the job `workflows` in .github/workflows/ci.yml.
      - docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - uvx zizmor@1.31.1 .github

  test:
    desc: Run all Rust tests (without the embedded web editor)
    cmds:
      - "{{.CARGO}} test --workspace --no-default-features"

  play:
    desc: Play the lighthouse example in the terminal
    aliases:
      - example
    cmds:
      - "{{.CARGO}} run -q -p loremaster --no-default-features -- play examples/lighthouse"

  import:zork:
    desc: Import Zork I from its MIT-licensed ZIL source into examples/zork1
    cmds:
      - test -d target/zil/zork1 || git clone -q https://github.com/historicalsource/zork1 target/zil/zork1
      # The commit that examples/zork1/README.md names.
      - git -C target/zil/zork1 checkout -q 97b7b3d68c075dd9af7da499c3e9690ada3471fd
      - "{{.CARGO}} run -q -p loremaster-zil -- target/zil/zork1 examples/zork1"
      - "{{.CARGO}} run -q -p loremaster --no-default-features -- check examples/zork1"

  check:story:
    desc: Check the lighthouse example for problems
    cmds:
      - "{{.CARGO}} run -q -p loremaster --no-default-features -- check examples/lighthouse"

  explore:
    desc: Walk all reachable states of the lighthouse example and report coverage
    cmds:
      - "{{.CARGO}} run -q -p loremaster --no-default-features -- explore examples/lighthouse"

  wasm:
    desc: Build the WASM package into the web app with Trunk (release)
    dir: crates/loremaster-wasm
    sources:
      - ../**/*.rs
      - ../**/Cargo.toml
      - Trunk.toml
      - index.html
    generates:
      - ../../web/src/lib/engine/pkg/loremaster-wasm_bg.wasm
    cmds:
      - trunk build --release

  wasm:watch:
    desc: Rebuild the WASM package whenever Rust code changes
    dir: crates/loremaster-wasm
    cmds:
      - trunk watch

  web:install:
    desc: Install web dependencies
    dir: web
    cmds:
      - pnpm install

  web:serve:
    desc: Start the Vite dev server only
    dir: web
    cmds:
      - pnpm dev

  dev:
    desc: Build WASM once, then run trunk watch and the Vite dev server together
    aliases:
      - web:dev
    cmds:
      - task: wasm
      - task: dev:watch

  dev:watch:
    internal: true
    deps:
      - wasm:watch
      - web:serve

  storybook:
    desc: Start Storybook for the design system on port 6006
    dir: web
    cmds:
      - pnpm storybook

  storybook:build:
    desc: Build a static Storybook into web/storybook-static
    dir: web
    cmds:
      - pnpm build-storybook

  web:check:
    desc: Type-check and lint the Svelte code and the stories
    dir: web
    cmds:
      - pnpm check

  web:build:
    desc: Build the static web app
    deps:
      - wasm
    dir: web
    cmds:
      - pnpm build

  build:static:
    desc: Build the browser-only site for GitHub Pages into web/build (below /loremaster)
    deps:
      - wasm
    dir: web
    env:
      BASE_PATH: /loremaster
      FALLBACK: 404.html
    cmds:
      - pnpm build

  release:ui:
    desc: Build the web app below / and copy it into crates/loremaster-mcp/ui for the embedded editor
    deps:
      - wasm
    env:
      BASE_PATH: ""
      FALLBACK: 200.html
    cmds:
      - pnpm --dir web build
      - rm -rf crates/loremaster-mcp/ui
      - cp -r web/build crates/loremaster-mcp/ui

  build:local:
    desc: Build the loremaster binary with the web editor in it (target/release/loremaster)
    deps:
      - release:ui
    cmds:
      - "{{.CARGO}} build --release -p loremaster"

  package:
    desc: Build the web editor, then package all crates for crates.io (no upload)
    deps:
      - release:ui
    cmds:
      # git ignores crates/loremaster-mcp/ui, so cargo sees its files as not committed.
      - "{{.CARGO}} package --workspace --exclude loremaster-wasm --exclude loremaster-zil --allow-dirty"

  release:publish:
    desc: After `cargo release --execute`, upload loremaster-mcp and loremaster (with the web editor) to crates.io
    preconditions:
      - sh: test -f crates/loremaster-mcp/ui/index.html
        msg: "There is no web editor in crates/loremaster-mcp/ui. Run `task release:ui` first."
      - sh: test -z "$(git status --porcelain)"
        msg: "The working tree has changes. Commit them or remove them first."
    cmds:
      # The ui/ files are the only "dirty" files: git ignores them.
      - "{{.CARGO}} publish -p loremaster-mcp -p loremaster --allow-dirty {{.CLI_ARGS}}"

  serve:local:
    desc: Build the local binary, then serve the lighthouse example with the editor
    deps:
      - build:local
    cmds:
      - target/release/loremaster serve examples/lighthouse {{.CLI_ARGS}}

  verify:
    desc: Formatting, clippy and tests
    deps:
      - fmt:check
      - lint
      - test
