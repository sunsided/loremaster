# A death ending sends the death prompt, and undo goes back one input.
name: Undo after drowning
steps:
  - e
  - { do: jump, see: ["The water closes over you", "Drowned"], ended: true }
  - { do: undo, see: "Lock Chamber", ended: false, room: lock_chamber }
expect:
  facts: { lock: full }
  ended: false
