# The best path: take the pages before midnight and accuse the keeper.
name: The pages before midnight
steps:
  - { do: examine stove, see: "The stove is cold." }
  - up
  - take windlass
  - down
  - e
  - open lower paddles
  - wait
  - { do: wait, see: "The chamber is empty." }
  - open gear housing
  - take pages
  - w
  - { do: examine stove, see: '"Do not touch the stove," the lock-keeper says.' }
  - { do: accuse keeper, see: "Committed for trial" }
expect:
  facts: { pages_burned: false }
  ending: committed
  not_see: "You smell smoke"
  ended: true
