- id: light_the_beacon
  on: { verb: [turn_on, lens] }
  when: oil_lamp.carried and oil_lamp.lit
  instead: true
  then:
    - set: { beacon_lit: true, lens.lit: true }
    - say: "You touch the lamp's flame to the wick. It catches, steadies, and then the lens takes it and throws it out across the water, a great slow wheel of light."
    - end: beacon_lit

- id: dusk_falls
  on: { time: "21:00" }
  then:
    - say: "The last of the light drains out of the sky."

- id: first_climb
  on: { enter: lantern_room }
  once: true
  then:
    - say: "You are out of breath, and the wind leans on the glass."
