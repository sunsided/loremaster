# Hand-ported from SCORE-OBJ and SCORE-UPD (1actions.zil), and the trophy case.
# The importer writes the points of each treasure as the properties `value`
# (for the first take) and `tvalue` (for the trophy case). Made with a small
# script from those properties; the score does not go down when a treasure
# leaves the case again.

- id: take_bag_of_coins
  on: { verb: [take, bag_of_coins] }
  when: bag_of_coins.carried
  once: true
  then:
    - add: { score: 10 }

- id: case_bag_of_coins
  on: { verb: [put, bag_of_coins, trophy_case] }
  when: in(bag_of_coins, trophy_case)
  once: true
  then:
    - add: { score: 5 }

