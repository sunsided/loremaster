# Imported from ZIL: BOOK (1dungeon.zil)
name: "black book"
aliases: ["book", "prayer", "page", "books"]
location: { room: south_temple }
portable: true
props: { open: false }
description:
  - "Commandment #12592 Oh ye who go about saying unto each: \"Hello sailor\": Dost thou know the magnitude of thy sin before the gods? Yea, verily, thou shalt be ground between two stones. Shall the angry gods cast thy body into the whirlpool? Surely, thy eye shall be put out with a sharp stick! Even unto the ends of the earth shalt thou wander and Unto the land of the dead shalt thou be sent at last. Surely thou shalt repent of thy cunning."
presence:
  - when: "book.interactions == 0"
    text: "On the altar is a large black book, open to page 569."
  - when: "book.interactions > 0"
    text: "There is {book.a} here."
