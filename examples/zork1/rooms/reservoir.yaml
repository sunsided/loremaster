# Imported from ZIL: RESERVOIR (1dungeon.zil)
name: "Reservoir"
tags: [dark]
position: [-4, -6]
description:
  - when: "low_tide"
    text: "You are on what used to be a large lake, but which is now a large mud pile. There are \"shores\" to the north and south."
  - when: "not low_tide"
    text: "You are on the lake. Beaches can be seen north and south. Upstream a small stream enters the lake through a narrow cleft in the rocks. The dam can be seen downstream."
exits:
  - { direction: north, to: reservoir_north }
  - { direction: south, to: reservoir_south }
  - { direction: up, to: in_stream }
  - { direction: west, to: in_stream }
