# Imported from ZIL: DAM-ROOM (1dungeon.zil)
name: "Dam"
position: [-2, -5]
description:
  - "You are standing on the top of the Flood Control Dam #3, which was quite a tourist attraction in times far distant. There are paths to the north, south, and west, and a scramble down."
  - when: "low_tide and gates_open"
    text: "The water level behind the dam is low: The sluice gates have been opened. Water rushes through the dam and downstream."
  - when: "(not (low_tide and gates_open)) and gates_open"
    text: "The sluice gates are open, and water rushes through the dam. The water level behind the dam is still high."
  - when: "(not (low_tide and gates_open)) and (not gates_open) and low_tide"
    text: "The sluice gates are closed. The water level in the reservoir is quite low, but the level is rising quickly."
  - when: "(not (low_tide and gates_open)) and (not gates_open) and (not low_tide)"
    text: "The sluice gates on the dam are closed. Behind the dam, there can be seen a wide reservoir. Water is pouring over the top of the now abandoned dam."
  - "There is a control panel here, on which a large metal bolt is mounted. Directly above the bolt is a small green plastic bubble"
  - when: "gate_flag"
    text: "which is glowing serenely"
  - "."
exits:
  - { direction: south, to: deep_canyon }
  - { direction: down, to: dam_base }
  - { direction: east, to: dam_base }
  - { direction: north, to: dam_lobby }
  - { direction: west, to: reservoir_south }
