title: The Salt Tower
author: loremaster example
start: section_1
seed: 7

intro:
  - "You are a courier. In your satchel is a sealed letter for the keeper of the Salt Tower, far out on the white flats."

# The dice in section 1 replace the values of the stats. The start values are
# not 0, so that a stat that is 0 always means that the character is spent.
vars:
  - { id: r, type: int, initial: 0 }
  - { id: margin, type: int, initial: 0 }
  - { id: skill_initial, type: int, initial: 9 }
  - { id: skill, type: int, initial: 9, min: 0, max: skill_initial }
  - { id: stamina_initial, type: int, initial: 19 }
  - { id: stamina, type: int, initial: 19, min: 0, max: stamina_initial }
  - { id: luck_initial, type: int, initial: 9 }
  - { id: luck, type: int, initial: 9, min: 0, max: luck_initial }
  - { id: gold, type: int, initial: 5, min: 0 }
  - { id: codeword_hearth, type: bool, initial: false }
