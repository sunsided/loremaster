- id: blackbeard_first_words
  on: { verb: [talk, blackbeard] }
  when: blackbeard.talked == 1
  instead: true
  then:
    - say: "The figure looks up. It is a man, grim-looking, with eyes like nails. \"Sit, if you like.\""

- id: blackbeard_names_himself
  on: { verb: [talk, blackbeard] }
  when: blackbeard.talked == 2
  instead: true
  then:
    - set: { knows_blackbeard_name: true }
    - say: "\"They call me Blackbeard,\" he says. \"And you're looking for a ship.\""

- id: blackbeard_more
  on: { verb: [talk, blackbeard] }
  when: blackbeard.talked >= 3
  instead: true
  then:
    - say: "Blackbeard nods. \"Ask me again tomorrow.\""
