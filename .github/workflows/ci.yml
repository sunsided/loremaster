name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workflows:
    name: Workflows (actionlint, zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: zizmor
        run: uvx zizmor@1.31.1 --format=github .github
        env:
          GH_TOKEN: ${{ github.token }}

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt -- --check
      # Without the embedded web editor: this job does not build web/.
      # --locked: CI builds exactly the committed Cargo.lock, with the
      # dramaturge release from crates.io that it names.
      - run: scripts/check-lock.sh
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --workspace --no-default-features --locked
      # The feature `dsl` of the crate loremaster: the re-exports of
      # loremaster-dsl and loremaster-macros, their doctests, and the world!
      # forms of the golden slice (tests/slice_dsl.rs). The workspace steps
      # above turn it on through the dev-dependency of loremaster-macros;
      # these steps check the crate alone with it.
      - run: cargo clippy -p loremaster --all-targets --no-default-features --features dsl --locked -- -D warnings
      - run: cargo test -p loremaster --no-default-features --features dsl --locked

  # Not a required check: the pending tests are expected to fail. The job
  # fails only when a pending test passes, so that its mark goes at once.
  pending:
    name: Pending tests (not required)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/pending-tests.sh

  # Not a required check: an early warning. It builds and tests loremaster
  # against the newest dramaturge on main, before its next release. Red
  # means that the next dramaturge bump needs changes in loremaster.
  dramaturge-tip:
    name: dramaturge main (not required)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: dramaturge-tip
      - name: Patch dramaturge to the tip of main
        run: |
          # A patch applies only when its version satisfies the requirement,
          # and a range never takes a pre-release of another version. Ask
          # for exactly the version on main, read at one commit and patched
          # to that commit, so a push to main in between can't skip the patch.
          rev=$(git ls-remote https://github.com/sunsided/dramaturge refs/heads/main | cut -f1)
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "error: could not resolve dramaturge main (got '$rev')"; exit 1; }
          version=$(curl -fsSL "https://raw.githubusercontent.com/sunsided/dramaturge/$rev/Cargo.toml" \
            | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] \
            || { echo "error: could not read the dramaturge version at $rev (got '$version')"; exit 1; }
          version=${version%%+*}  # build metadata does not take part in matching
          echo "dramaturge main: $rev, version $version"
          sed -i -E "s/^(dramaturge-[a-z]+ = (\\{ version = )?)\"[^\"]+\"/\\1\"=$version\"/" Cargo.toml
          mkdir -p .cargo
          {
            echo '[patch.crates-io]'
            for crate in dramaturge-model dramaturge-runtime dramaturge-authoring dramaturge-syntax; do
              echo "$crate = { git = \"https://github.com/sunsided/dramaturge\", rev = \"$rev\" }"
            done
          } > .cargo/config.toml
          cargo update -p dramaturge-model -p dramaturge-runtime -p dramaturge-authoring -p dramaturge-syntax
          # The job is worth nothing if cargo fell back to crates.io.
          for crate in dramaturge-model dramaturge-runtime dramaturge-authoring dramaturge-syntax; do
            grep -A2 "^name = \"$crate\"$" Cargo.lock | grep -q '^source = "git+https://github.com/sunsided/dramaturge' \
              || { echo "error: $crate does not come from dramaturge main"; exit 1; }
          done
      - run: cargo test --workspace --no-default-features

  web:
    name: Web (WASM, check, build, Storybook, crates)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm
      - uses: jetli/trunk-action@1346cc09eace4beb84e403e199a471346d4684c9 # v0.5.1
        with:
          version: v0.22.1
      - name: Build the WASM package
        working-directory: crates/loremaster-wasm
        run: trunk build --release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Yarn comes through corepack, in the version that web/package.json pins
      # (`packageManager`). No setup-node cache: it would call the runner's
      # global Yarn 1 before corepack is enabled.
      - run: corepack enable
      - working-directory: web
        run: yarn install --immutable
      - working-directory: web
        run: yarn check
      - working-directory: web
        run: yarn build
      # The same as `task release:ui`: the build is below `/` (no BASE_PATH).
      - name: Copy the web editor into loremaster-mcp
        run: cp -r web/build crates/loremaster-mcp/ui
      # git ignores ui/, so cargo sees its files as not committed.
      - name: Package the crates for crates.io
        run: cargo package --workspace --exclude loremaster-wasm --exclude loremaster-zil --exclude loremaster-terminal-host --allow-dirty --locked
      - working-directory: web
        run: yarn build-storybook
