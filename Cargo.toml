[workspace]
resolver = "3"
members = [
    "crates/loremaster-build",
    "crates/loremaster-cli",
    "crates/loremaster-dsl",
    "crates/loremaster-lang",
    "crates/loremaster-macros",
    "crates/loremaster-mcp",
    "crates/loremaster-model",
    "crates/loremaster-project",
    "crates/loremaster-runtime",
    "crates/loremaster-tools",
    "crates/loremaster-wasm",
    "crates/loremaster-workbench",
    "crates/loremaster-zil",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "EUPL-1.2"
authors = ["Markus Mayer"]
repository = "https://github.com/sunsided/loremaster"
homepage = "https://sunsided.github.io/loremaster/"
rust-version = "1.89"

[workspace.dependencies]
loremaster-dsl = { version = "0.1.0", path = "crates/loremaster-dsl" }
loremaster-lang = { version = "0.1.0", path = "crates/loremaster-lang" }
loremaster-macros = { version = "0.1.0", path = "crates/loremaster-macros" }
loremaster-model = { version = "0.1.0", path = "crates/loremaster-model" }
loremaster-project = { version = "0.1.0", path = "crates/loremaster-project" }
loremaster-runtime = { version = "0.1.0", path = "crates/loremaster-runtime" }
loremaster-tools = { version = "0.1.0", path = "crates/loremaster-tools" }
loremaster-workbench = { version = "0.1.0", path = "crates/loremaster-workbench" }
loremaster-mcp = { version = "0.1.0", path = "crates/loremaster-mcp" }
dramaturge-model = "=0.3.0-alpha.5"
dramaturge-runtime = "=0.3.0-alpha.5"
dramaturge-authoring = "=0.3.0-alpha.5"
dramaturge-syntax = { version = "=0.3.0-alpha.5", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde-saphyr = "2"
sha2 = "0.10"
thiserror = "2"
tiny_http = "0.12"
include_dir = "0.7"
assert2 = "0.4"
proptest = "1.12"
proc-macro2 = "1"
quote = "1"
syn = "2"
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release.package.loremaster-wasm]
opt-level = "s"
