[workspace]
resolver = "3"
members = [
    "crates/loremaster-cli",
    "crates/loremaster-lang",
    "crates/loremaster-mcp",
    "crates/loremaster-model",
    "crates/loremaster-project",
    "crates/loremaster-runtime",
    "crates/loremaster-tools",
    "crates/loremaster-wasm",
    "crates/loremaster-zil",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "EUPL-1.2"
authors = ["Markus Mayer"]
publish = false

[workspace.dependencies]
loremaster-lang = { path = "crates/loremaster-lang" }
loremaster-model = { path = "crates/loremaster-model" }
loremaster-project = { path = "crates/loremaster-project" }
loremaster-runtime = { path = "crates/loremaster-runtime" }
loremaster-tools = { path = "crates/loremaster-tools" }
loremaster-mcp = { path = "crates/loremaster-mcp" }
dramaturge-model = "0.2.0"
dramaturge-runtime = "0.2.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde-saphyr = "2"
sha2 = "0.10"
thiserror = "2"
tiny_http = "0.12"
include_dir = "0.7"
assert2 = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release.package.loremaster-wasm]
opt-level = "s"
