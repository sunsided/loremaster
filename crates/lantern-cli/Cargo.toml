[package]
name = "lantern-cli"
description = "Terminal player and checker for lantern stories."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "lantern"
path = "src/main.rs"

[dependencies]
lantern-mcp.workspace = true
lantern-project.workspace = true
lantern-runtime.workspace = true

[features]
# The `lantern` binary serves the web editor. Build the web app first: `task build:local`.
embed-ui = ["lantern-mcp/embed-ui"]

[lints]
workspace = true
