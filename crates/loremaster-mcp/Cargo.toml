[package]
name = "loremaster-mcp"
description = "MCP server and proposal endpoints for loremaster projects: `loremaster mcp` (stdio) and `loremaster serve` (local HTTP)."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["text-adventure", "interactive-fiction", "mcp", "llm", "server"]
categories = ["game-development", "development-tools", "web-programming::http-server"]
# `ui/` is in .gitignore. `include` puts it in the package all the same.
include = ["/src/", "/build.rs", "/ui/", "/writing-stories.md", "/README.md", "/LICENSE"]

[dependencies]
loremaster-project.workspace = true
loremaster-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
tiny_http.workspace = true
include_dir = { workspace = true, optional = true }

[features]
# Embed the built web app (`ui/`, a copy of web/build) and serve it at `/`. Run `task release:ui` first.
embed-ui = ["dep:include_dir"]

# cargo-release: build the web editor into `ui/` before the release commit.
# cargo publish sees the files in `ui/` as not committed, and cargo-release cannot give
# `--allow-dirty`. Thus `task release:publish` uploads this crate and `loremaster`.
[package.metadata.release]
pre-release-hook = ["task", "--dir", "../..", "release:ui"]
publish = false

[lints]
workspace = true
