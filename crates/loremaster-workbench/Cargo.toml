exclude = ["tests/"]

[dependencies]
loremaster-lang.workspace = true
loremaster-model.workspace = true
loremaster-runtime.workspace = true
serde.workspace = true

[dev-dependencies]
loremaster-project.workspace = true

[lints]
workspace = true
