[package]
name = "loremaster-wasm"
description = "WebAssembly bindings for the loremaster runtime, used by the web editor and player."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
loremaster-model.workspace = true
loremaster-project.workspace = true
loremaster-runtime.workspace = true
loremaster-lang.workspace = true
serde_json.workspace = true
serde.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[package.metadata.release]
# Not on crates.io. cargo-release does not release this crate.
release = false

[lints]
workspace = true
